<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tärningsriket</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: en kolumn som en äventyrsbok – startsida med hjältegalleri, skaparen som steg med levande förhandsvisning högst upp. Medvetet ett mörkt tema (natt i skogen). */
:root{
  --bg:#142029; --bg2:#1b2b37; --panel:#22384a; --line:#34506a;
  --fg:#f3eedf; --muted:#a9b8c2; --gold:#f2c14e; --gold-dk:#b9892a;
  --moss:#7cc47f; --red:#e35d4f; --sky:#6fb6e8;
  --display:"Pixelify Sans", "Courier New", monospace;
  --body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:16px;line-height:1.5;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 110px;
  background-image:radial-gradient(1px 1px at 20% 30%,#ffffff55 50%,transparent 51%),radial-gradient(1px 1px at 70% 12%,#ffffff44 50%,transparent 51%),radial-gradient(1.5px 1.5px at 85% 60%,#ffffff33 50%,transparent 51%),radial-gradient(1px 1px at 40% 80%,#ffffff33 50%,transparent 51%);
  background-size:260px 260px;}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.02em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{font-family:var(--display);font-weight:700;font-size:1.05rem;border:0;border-radius:6px;padding:12px 18px;background:var(--gold);color:#2a1d05;box-shadow:0 4px 0 var(--gold-dk);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-dk)}
.btn.ghost{background:var(--panel);color:var(--fg);box-shadow:0 4px 0 #0c151c}
.btn:disabled{opacity:.45;cursor:not-allowed}
canvas.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block;width:100%;height:auto}

/* Hero */
.hero{display:flex;align-items:center;gap:16px}
.hero svg{width:72px;height:72px;flex:none}
.hero h1{font-size:clamp(2rem,8vw,3rem);color:var(--gold);line-height:1}
.hero p{margin:6px 0 0;color:var(--muted);max-width:46ch}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.section-head h2{font-size:1.4rem}
.section-head span{color:var(--muted);font-size:.9rem}

/* Hjältekort */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{background:var(--bg2);border:2px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;text-align:left;position:relative}
.card.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.card .tv{border-radius:4px;overflow:hidden;border:2px solid #0c151c}
.card .name{font-family:var(--display);font-size:1.2rem;line-height:1.1}
.card .meta{font-size:.82rem;color:var(--muted);line-height:1.3}
.card .row{display:flex;gap:6px}
.card .row button{flex:1;font-size:.82rem;font-weight:800;border-radius:5px;border:2px solid var(--line);background:var(--panel);padding:6px 4px}
.card.on .take{background:var(--gold);color:#2a1d05;border-color:var(--gold)}
.tag{position:absolute;top:14px;left:14px;font-family:var(--display);font-size:.7rem;background:#0c151cdd;padding:2px 6px;border-radius:3px;color:var(--moss)}
.newcard{border-style:dashed;align-items:center;justify-content:center;min-height:200px;color:var(--gold);font-family:var(--display);font-size:1.1rem;gap:6px}
.newcard b{font-size:2.6rem;line-height:1}

/* Sällskapsbar */
.party{position:fixed;left:0;right:0;bottom:0;z-index:5;background:#0e171eee;border-top:2px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.party .in{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.party .who{font-size:.9rem;color:var(--muted);min-width:0}
.party .who b{color:var(--fg);display:block;font-family:var(--display);font-size:1.05rem}
.note{background:var(--panel);border-left:4px solid var(--moss);padding:10px 12px;border-radius:4px;font-size:.92rem}

/* Skaparen */
.preview{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center;background:var(--bg2);border:2px solid var(--line);border-radius:8px;padding:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:3}
.preview .tv{border:2px solid #0c151c;border-radius:4px;overflow:hidden}
.preview h3{font-size:1.4rem}
.preview p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.steps{display:flex;gap:6px;margin-top:8px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps i.done{background:var(--gold)}
.stephead{display:flex;flex-direction:column;gap:4px}
.stephead small{font-family:var(--display);color:var(--gold);letter-spacing:.08em;text-transform:uppercase;font-size:.8rem}
.stephead h2{font-size:1.6rem}
.stephead p{margin:0;color:var(--muted)}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.choice{background:var(--bg2);border:2px solid var(--line);border-radius:8px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px}
.choice.sel{border-color:var(--gold);background:#2a3a2a}
.choice strong{font-family:var(--display);font-size:1.15rem}
.choice .bonus{color:var(--gold);font-weight:800;font-size:.85rem}
.choice span{font-size:.9rem;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-weight:800}
.field input{font:inherit;font-size:1.2rem;padding:12px;border-radius:6px;border:2px solid var(--line);background:var(--bg2);color:var(--fg);width:100%}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:42px;height:42px;border-radius:6px;border:3px solid var(--line)}
.sw.sel{border-color:var(--gold);transform:scale(1.08)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:2px solid var(--line);background:var(--bg2);border-radius:20px;padding:8px 14px;font-weight:800}
.pill.sel{border-color:var(--gold);background:var(--gold);color:#2a1d05}
.nav{display:flex;justify-content:space-between;gap:12px}

/* Tärningar & egenskaper */
.stats{display:flex;flex-direction:column;gap:8px}
.stat{display:grid;grid-template-columns:minmax(0,1fr) auto 52px;gap:10px;align-items:center;background:var(--bg2);border:2px solid var(--line);border-radius:8px;padding:8px 10px}
.stat .lbl b{display:block;font-family:var(--display);font-size:1.05rem}
.stat .lbl span{font-size:.8rem;color:var(--muted)}
.dice{display:flex;gap:4px}
.die{width:28px;height:28px;border-radius:5px;background:var(--fg);color:#142029;font-family:var(--display);font-weight:700;display:grid;place-items:center;font-size:.95rem}
.die.drop{opacity:.3;text-decoration:line-through}
.die.spin{animation:spin .45s ease-out}
@keyframes spin{0%{transform:rotate(-200deg) scale(.6)}100%{transform:none}}
.score{text-align:center;font-family:var(--display);font-size:1.5rem;line-height:1;font-variant-numeric:tabular-nums}
.score small{display:block;font-size:.75rem;color:var(--gold)}
.score .plus{color:var(--moss);font-size:.7rem;display:block}
.rollbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rollbar span{color:var(--muted);font-size:.9rem}

/* Hjälteblad */
.overlay{position:fixed;inset:0;background:#05090ccc;z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:env(safe-area-inset-top,0px) 0 0}
.sheet{background:var(--bg);border-top:3px solid var(--gold);border-radius:12px 12px 0 0;width:100%;max-width:720px;max-height:92%;overflow-y:auto;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.sheet-top{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:center}
.sheet-top .tv{border:2px solid #0c151c;border-radius:4px;overflow:hidden}
.sheet-top h2{font-size:1.8rem;color:var(--gold)}
.sheet-top p{margin:2px 0 0;color:var(--muted)}
.vitals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vital{background:var(--bg2);border:2px solid var(--line);border-radius:8px;padding:8px;text-align:center}
.vital b{display:block;font-family:var(--display);font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.vital span{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.vital.hp b{color:var(--red)} .vital.ac b{color:var(--sky)} .vital.atk b{color:var(--gold)}
.bars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;font-size:.88rem}
.bar .track{grid-column:1/-1;height:8px;background:var(--panel);border-radius:4px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--moss)}
.bar em{font-style:normal;font-weight:800;font-variant-numeric:tabular-nums}
.ability{background:var(--bg2);border:2px solid var(--line);border-radius:8px;padding:10px 12px}
.ability strong{font-family:var(--display);color:var(--gold)}
.ability p{margin:2px 0 0;font-size:.92rem}
.danger{color:var(--red)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#3a1f1c;border-radius:8px;padding:10px}
@media (max-width:420px){.preview{grid-template-columns:84px 1fr}.sheet-top{grid-template-columns:96px minmax(0,1fr)}.stat{grid-template-columns:minmax(0,1fr) auto 46px}.die{width:24px;height:24px;font-size:.85rem}}
@media (prefers-reduced-motion:reduce){.die.spin{animation:none}.btn{transition:none}}
</style>

<div class="wrap" id="app"></div>
<div class="party" id="party"></div>
<div id="modal"></div>

<script>
/* ===== Regeldata ===== */
const STATS=[
 {k:"sty",n:"Styrka",d:"lyfta, slåss, knuffa"},
 {k:"smi",n:"Smidighet",d:"smyga, sikta, hoppa"},
 {k:"tal",n:"Tålighet",d:"orka, tåla smällar"},
 {k:"klo",n:"Klokhet",d:"minnas, lösa gåtor"},
 {k:"vis",n:"Visdom",d:"märka saker, känna av"},
 {k:"cha",n:"Charm",d:"prata, övertala, sjunga"}];
const FOLK={
 manniska:{n:"Människa",bonus:{sty:1,smi:1,tal:1,klo:1,vis:1,cha:1},b:"+1 på allt",t:"Bra på lite av allt."},
 alv:{n:"Alv",bonus:{smi:2},b:"+2 Smidighet",t:"Ser i mörker och har spetsiga öron som hör långt."},
 dvarg:{n:"Dvärg",bonus:{tal:2},b:"+2 Tålighet",t:"Seg som en sten. Hittar hemliga gångar i grottor."},
 halvling:{n:"Halvling",bonus:{smi:2},b:"+2 Smidighet",t:"Tur: får slå om när tärningen visar 1."},
 katt:{n:"Katt",bonus:{smi:2,vis:1},b:"+2 Smidighet, +1 Visdom",t:"Landar alltid på fötterna och hör en mus på långt håll."}};
const KLASS={
 riddare:{n:"Riddare",hd:10,main:"sty",ac:h=>16,acTxt:"Ringbrynja och sköld",vapen:"Svärd",skada:"1d8",fa:"Andra andningen",ft:"En gång per strid kan du hela dig själv med 1d10 kraft.",col:"#4b6fa8",t:"Stark och modig. Står längst fram och skyddar vännerna."},
 trollkarl:{n:"Trollkarl",hd:6,main:"klo",ac:h=>10+mod(h.s.smi),acTxt:"Inga rustningar, bara kåpa",vapen:"Trollstav",skada:"1d6",fa:"Magisk pil",ft:"Tre glödande pilar som alltid träffar. 1d4+1 skada var.",col:"#7a4fb0",t:"Kan trollformler. Klokast i gänget."},
 bagskytt:{n:"Bågskytt",hd:10,main:"smi",ac:h=>11+mod(h.s.smi),acTxt:"Läderrustning",vapen:"Pilbåge",skada:"1d8",fa:"Spårare",ft:"Hittar spår och vet vilka djur som gått förbi.",col:"#3f8a4f",t:"Träffar på långt håll och hittar i skogen."},
 smygare:{n:"Smygare",hd:8,main:"smi",ac:h=>11+mod(h.s.smi),acTxt:"Mjuk läderrustning",vapen:"Dolk",skada:"1d4",fa:"Smygattack",ft:"När du smyger dig på någon gör du 1d6 extra skada.",col:"#4a4f5c",t:"Tyst som en skugga. Öppnar lås och hittar fällor."},
 helare:{n:"Helare",hd:8,main:"vis",ac:h=>15,acTxt:"Fjällrustning och sköld",vapen:"Stridsklubba",skada:"1d6",fa:"Läkande ord",ft:"Hela en vän med 1d4 + din Visdomsbonus.",col:"#b8862e",t:"Lagar skrubbsår och troll-bett. Alla vill ha en helare med."},
 bard:{n:"Bard",hd:8,main:"cha",ac:h=>11+mod(h.s.smi),acTxt:"Läderjacka",vapen:"Värja",skada:"1d6",fa:"Peppsång",ft:"En vän får slå 1d6 extra på sitt nästa slag.",col:"#b0475a",t:"Sjunger, skojar och kan prata sig ur det mesta."}};
const SKIN=["#f5d3b5","#e8b48f","#c98e62","#8d5a3b","#5c3a26","#9ccf8f"];
const HAIR=["#f3d66b","#c9732f","#6b4423","#2a1c14","#e8e3d8","#d65a8f","#6fb6e8","#ef8a2b","#8a8f99","#222222"];
const OUTFIT=["#4b6fa8","#7a4fb0","#3f8a4f","#b0475a","#c98a2e","#4a4f5c","#2f8c8c"];
const STYLES={kort:"Kort",lang:"Långt",tofs:"Tofsar",kal:"Kal"};
const mod=v=>Math.floor((v-10)/2);
const fmt=n=>(n>=0?"+":"")+n;

/* ===== Grundfigurerna ===== */
const BASE=[
 {id:"ville",namn:"Ville",folk:"manniska",klass:"riddare",hud:0,har:0,stil:"kort",klader:0,s:{sty:16,smi:12,tal:15,klo:10,vis:11,cha:12},om:"Modig och alltid först in genom dörren."},
 {id:"svante",namn:"Svante",folk:"manniska",klass:"trollkarl",hud:1,har:1,stil:"kort",klader:1,s:{sty:9,smi:13,tal:12,klo:16,vis:13,cha:11},om:"Kan en trollformel för nästan allt. Nästan."},
 {id:"tomas",namn:"Tomas",folk:"dvarg",klass:"helare",hud:1,har:2,stil:"kal",klader:4,s:{sty:14,smi:10,tal:16,klo:11,vis:15,cha:12},om:"Har skägg, sköld och plåster i fickan."},
 {id:"linda",namn:"Linda",folk:"alv",klass:"bagskytt",hud:0,har:3,stil:"lang",klader:2,s:{sty:11,smi:17,tal:12,klo:13,vis:14,cha:12},om:"Missar aldrig ett mål och hör allt som rör sig i skogen."},
 {id:"sally",namn:"Sally",folk:"katt",klass:"smygare",hud:0,har:8,stil:"kort",klader:5,s:{sty:8,smi:17,tal:11,klo:12,vis:15,cha:14},om:"Katt. Smyger, nosar och hittar alltid hem."}];
BASE.forEach(h=>h.grund=true);

/* ===== Lagring (bara i den här webbläsaren) ===== */
const KEY="tarningsriket-hjaltar", PKEY="tarningsriket-sallskap";
function load(k,def){try{const v=JSON.parse(localStorage.getItem(k));return v??def}catch(e){return def}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let egna=load(KEY,[]), party=load(PKEY,["ville","svante","sally"]);
const alla=()=>[...BASE,...egna];
const byId=id=>alla().find(h=>h.id===id);

/* ===== Pixelporträtt ===== */
const HUMAN=[
"............","............","...SSSSSS...","..SSSSSSSS..","..SSESSESS..","..SSSSSSSS..","...SSMMSS...","....SSSS....",
"..OOOOOOOO..",".OOOOOOOOOO.",".SOODDDDOOS.",".SOOOOOOOOS.","..LLL..LLL..","..LL....LL.."];
const CAT=[
"............","............",".F......F...",".FP....PF...",".FFFFFFFF...",".FEFFFFEF...",".FFFNNFFF...","..FFFFFF....",
"..FFFFFFF..T",".FFFFFFFFF.T",".FFWWWWFFFT.",".FFWWWWFFFT.",".FFFFFFFFF..",".FF.FF.FF..."];
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
 const c=x=>Math.max(0,Math.min(255,Math.round(f<0?x*(1+f):x+(255-x)*f)));return"#"+[c(r),c(g),c(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function drawHero(cv,h){
 const W=16,H=18;cv.width=W;cv.height=H;const g=cv.getContext("2d");
 const K=KLASS[h.klass]; g.fillStyle=shade(K.col,-.55);g.fillRect(0,0,W,H);
 g.fillStyle=shade(K.col,-.4);g.fillRect(0,14,W,4); // golv
 // stjärnor
 g.fillStyle="#ffffff55";[[1,2],[13,1],[15,6],[0,9]].forEach(([x,y])=>g.fillRect(x,y,1,1));
 const p=(x,y,c)=>{if(c){g.fillStyle=c;g.fillRect(x,y,1,1)}};
 const skin=SKIN[h.hud],hair=HAIR[h.har],out=OUTFIT[h.klader];
 const ox=2,oy=4,cat=h.folk==="katt";
 if(cat){
  const fur=hair,map={F:fur,E:"#7fdc6a",N:"#e98aa8",P:"#e98aa8",W:shade(fur,.7),T:fur};
  CAT.forEach((r,y)=>[...r].forEach((ch,x)=>p(ox+x,oy+y,map[ch])));
  // halsduk i klädfärg
  [2,3,4,5,6,7].forEach(x=>p(ox+x,oy+7,out)); p(ox+6,oy+8,out);
 }else{
  const map={S:skin,E:"#1b1b22",M:shade(skin,-.35),O:out,D:shade(out,-.4),L:"#3a2c22"};
  HUMAN.forEach((r,y)=>[...r].forEach((ch,x)=>p(ox+x,oy+y,map[ch])));
  if(h.folk==="alv"){p(ox+1,oy+3,skin);p(ox+0,oy+2,skin);p(ox+10,oy+3,skin);p(ox+11,oy+2,skin)}
  const hr=(x,y)=>p(ox+x,oy+y,hair);
  if(h.stil!=="kal"){
   for(let x=3;x<=8;x++)hr(x,0);for(let x=2;x<=9;x++){hr(x,1);hr(x,2)}
   hr(2,3);hr(9,3);
   if(h.stil==="lang"){for(let y=3;y<=9;y++){hr(1,y);hr(10,y)}hr(2,4);hr(9,4)}
   if(h.stil==="tofs"){hr(0,2);hr(1,2);hr(0,3);hr(11,2);hr(10,2);hr(11,3);hr(0,4);hr(11,4)}
  }else{for(let x=3;x<=8;x++)p(ox+x,oy+2,skin)}
  if(h.folk==="dvarg"){ // skägg
   ["..HHHHHHHH..","..HHH..HHH..","..HHHHHHHH..","...HHHHHH...","....HHHH...."].forEach((r,i)=>[...r].forEach((ch,x)=>{if(ch==="H")hr(x,5+i)}));
   p(ox+5,oy+6,shade(skin,-.35));p(ox+6,oy+6,shade(skin,-.35));
  }
  if(h.folk==="halvling"){p(ox+2,oy+13,skin);p(ox+3,oy+13,skin);p(ox+8,oy+13,skin);p(ox+9,oy+13,skin)} // bara fötter
 }
 // klassprylar
 const k=h.klass;
 if(k==="trollkarl"){const c=shade(out,-.15);p(9,0,c);p(8,1,c);p(9,1,c);for(let x=7;x<=10;x++)p(x,2,c);for(let x=6;x<=10;x++)p(x,3,c);
   for(let x=cat?2:3;x<=(cat?11:12);x++)p(x,cat?5:4,c);p(8,3,"#f2c14e");
   for(let y=4;y<=17;y++)p(14,y,"#8a5a2b");p(14,3,"#6fe3ff");p(13,3,"#6fe3ff55");p(15,3,"#6fe3ff55");p(14,2,"#6fe3ff55")}
 if(k==="riddare"){if(!cat){const m="#b9c3cc",d="#7d8790";for(let x=4;x<=11;x++){p(x,4,m);p(x,5,m)}for(let x=5;x<=10;x++)p(x,3,m);p(4,6,d);p(11,6,d);p(4,7,d);p(11,7,d);p(7,2,"#e35d4f");p(8,2,"#e35d4f")}
   for(let y=6;y<=13;y++)p(14,y,"#dfe6ec");p(13,14,"#f2c14e");p(14,14,"#f2c14e");p(15,14,"#f2c14e");p(14,15,"#6b4423");p(14,16,"#6b4423");
   const s="#7d8790";for(let y=13;y<=16;y++)for(let x=0;x<=2;x++)p(x,y,s);p(1,14,"#f2c14e")}
 if(k==="bagskytt"){const b="#8a5a2b";[[13,7],[14,8],[15,9],[15,10],[15,11],[14,12],[13,13]].forEach(([x,y])=>p(x,y,b));for(let y=8;y<=12;y++)p(13,y,"#e8e3d8");
   if(!cat){p(1,9,"#6b4423");p(1,10,"#6b4423");p(1,11,"#6b4423");p(1,8,"#e35d4f")}}
 if(k==="smygare"){p(14,14,"#dfe6ec");p(14,13,"#dfe6ec");p(14,15,"#6b4423");p(13,15,"#f2c14e");p(15,15,"#f2c14e");
   if(!cat){const c=shade(out,-.25);for(let x=3;x<=12;x++)p(x,4,c);for(let x=2;x<=13;x++)p(x,5,c);p(4,6,c);p(11,6,c);p(4,7,c);p(11,7,c)}}
 if(k==="helare"){const yy=cat?oy+10:oy+10,xx=cat?ox+4:ox+5;p(xx,yy-1,"#f2c14e");p(xx-1,yy,"#f2c14e");p(xx,yy,"#f2c14e");p(xx+1,yy,"#f2c14e");p(xx,yy+1,"#f2c14e");
   for(let y=10;y<=15;y++)p(14,y,"#6b4423");p(13,9,"#b9c3cc");p(14,9,"#b9c3cc");p(15,9,"#b9c3cc");p(14,8,"#b9c3cc")}
 if(k==="bard"){const w="#a8693a";[[13,12],[14,12],[13,13],[14,13],[15,13],[13,14],[14,14]].forEach(([x,y])=>p(x,y,w));p(14,13,"#3a2c22");for(let y=8;y<=11;y++)p(15,y,"#6b4423");p(15,7,"#f2c14e")}
}
function portrait(h){const c=document.createElement("canvas");c.className="px";drawHero(c,h);return c}

/* ===== Beräkningar ===== */
function finalStats(h){return h.s} // sparade hjältar har redan folkbonus i h.s
function vitals(h){const K=KLASS[h.klass],s=finalStats(h);
 return{hp:Math.max(1,K.hd+mod(s.tal)),ac:K.ac(h),atk:mod(s[K.main])+2}}

/* ===== Hjälpare ===== */
const app=document.getElementById("app");
function el(tag,attrs={},...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==="class")e.className=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(k,v===true?"":v)}
 kids.flat().forEach(c=>c!=null&&e.append(c.nodeType?c:document.createTextNode(c)));return e}
function d20svg(){const s=el("div");s.innerHTML=`<svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,4 92,28 92,72 50,96 8,72 8,28" fill="#f2c14e" stroke="#2a1d05" stroke-width="3"/><polygon points="50,22 76,66 24,66" fill="#f7d77f" stroke="#2a1d05" stroke-width="3"/><path d="M50 4L50 22M92 28L76 66M8 28L24 66M50 96L24 66M50 96L76 66M8 72L24 66M92 72L76 66M8 28L50 22M92 28L50 22" stroke="#2a1d05" stroke-width="3" fill="none"/><text x="50" y="58" text-anchor="middle" font-family="Pixelify Sans,monospace" font-weight="700" font-size="20" fill="#2a1d05">20</text></svg>`;return s.firstChild}

/* ===== Startsidan ===== */
function home(){
 app.replaceChildren();
 app.append(el("header",{class:"hero"},d20svg(),el("div",{},el("h1",{},"Tärningsriket"),el("p",{},"Ett rollspelsäventyr för hela familjen. Välj vilka hjältar som ska med, eller skapa en egen."))));
 app.append(el("div",{class:"section-head"},el("h2",{},"Hjältarna"),el("span",{},"Tryck på en hjälte för att se hjältebladet")));
 const grid=el("div",{class:"grid"});
 alla().forEach(h=>grid.append(card(h)));
 grid.append(el("button",{class:"card newcard",onclick:()=>creator()},el("b",{},"+"),"Skapa egen hjälte"));
 app.append(grid);
 if(!egna.length)app.append(el("p",{class:"note"},"Egna hjältar sparas i den här webbläsaren. Skapar du en på mobilen syns den bara där."));
 renderParty(); window.scrollTo(0,0);
}
function card(h){
 const on=party.includes(h.id),F=FOLK[h.folk],K=KLASS[h.klass];
 return el("div",{class:"card"+(on?" on":"")},
  el("div",{class:"tv"},portrait(h)),
  h.grund?null:el("span",{class:"tag"},"Egen"),
  el("div",{},el("div",{class:"name"},h.namn),el("div",{class:"meta"},F.n+" · "+K.n)),
  el("div",{class:"row"},
   el("button",{onclick:()=>sheet(h),"aria-label":"Visa hjältebladet för "+h.namn},"Blad"),
   el("button",{class:"take","aria-pressed":on?"true":"false",onclick:()=>togglePartyMember(h.id)},on?"Med ✓":"Ta med")));
}
function togglePartyMember(id){
 if(party.includes(id))party=party.filter(x=>x!==id);
 else{if(party.length>=4){flash("Max fyra hjältar i sällskapet. Ta bort någon först.");return}party=[...party,id]}
 save(PKEY,party);home();
}
function renderParty(){
 const box=document.getElementById("party");
 const names=party.map(byId).filter(Boolean).map(h=>h.namn);
 box.replaceChildren(el("div",{class:"in"},
  el("div",{class:"who"},el("b",{},"Sällskapet ("+names.length+"/4)"),names.length?names.join(", "):"Ingen vald ännu"),
  el("button",{class:"btn",disabled:!names.length,onclick:()=>flash("Äventyret bygger vi i nästa steg. Sällskapet är sparat!")},"Ge er av!")));
 box.hidden=false;
}
let flashT;function flash(msg){let f=document.getElementById("flash");if(!f){f=el("div",{id:"flash",class:"note",style:"position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:30;max-width:90vw;box-shadow:0 6px 20px #0008"});document.body.append(f)}
 f.textContent=msg;f.hidden=false;clearTimeout(flashT);flashT=setTimeout(()=>f.hidden=true,2800)}

/* ===== Hjälteblad ===== */
function sheet(h){
 const m=document.getElementById("modal"),F=FOLK[h.folk],K=KLASS[h.klass],v=vitals(h),s=finalStats(h);
 const close=()=>m.replaceChildren();
 const bars=el("div",{class:"bars"},STATS.map(st=>el("div",{class:"bar"},el("span",{},st.n),el("em",{},s[st.k]+" ("+fmt(mod(s[st.k]))+")"),el("div",{class:"track"},el("i",{style:"width:"+Math.min(100,s[st.k]/20*100)+"%"})))));
 const foot=el("div",{class:"nav"});
 if(!h.grund){const del=el("button",{class:"btn ghost danger",onclick:()=>{foot.replaceChildren(el("div",{class:"confirm"},el("span",{},"Ta bort "+h.namn+" för alltid?"),
   el("button",{class:"btn",onclick:()=>{egna=egna.filter(x=>x.id!==h.id);party=party.filter(x=>x!==h.id);save(KEY,egna);save(PKEY,party);close();home()}},"Ja, ta bort"),
   el("button",{class:"btn ghost",onclick:()=>{close();sheet(h)}},"Nej")))}},"Ta bort");foot.append(del)}else foot.append(el("span"));
 foot.append(el("button",{class:"btn",onclick:close},"Stäng"));
 const sh=el("div",{class:"sheet",role:"dialog","aria-modal":"true","aria-label":"Hjälteblad för "+h.namn},
  el("div",{class:"sheet-top"},el("div",{class:"tv"},portrait(h)),el("div",{},el("h2",{},h.namn),el("p",{},F.n+" · "+K.n+" · Nivå 1"),h.om?el("p",{},h.om):null)),
  el("div",{class:"vitals"},
   el("div",{class:"vital hp"},el("b",{},v.hp),el("span",{},"Liv")),
   el("div",{class:"vital ac"},el("b",{},v.ac),el("span",{},"Rustning")),
   el("div",{class:"vital atk"},el("b",{},fmt(v.atk)),el("span",{},"Anfall"))),
  bars,
  el("div",{class:"ability"},el("strong",{},K.vapen+" · "+K.skada+" skada"),el("p",{},"Slå en d20 och lägg till "+fmt(v.atk)+". Kommer du upp i fiendens rustning så träffar du.")),
  el("div",{class:"ability"},el("strong",{},K.fa),el("p",{},K.ft)),
  el("div",{class:"ability"},el("strong",{},F.n),el("p",{},F.t)),
  foot);
 const ov=el("div",{class:"overlay",onclick:e=>{if(e.target===ov)close()}},sh);
 m.replaceChildren(ov);
}

/* ===== Karaktärsskaparen ===== */
let draft, step;
const STEPS=["Folk","Klass","Utseende","Tärningar","Klar"];
function creator(){
 draft={id:"egen-"+Date.now(),namn:"",folk:null,klass:null,hud:0,har:0,stil:"kort",klader:0,rolls:null,omslag:3,om:""};
 step=0; document.getElementById("party").hidden=true; renderCreator();
}
function rolled(){const s={};STATS.forEach(st=>{s[st.k]=(draft.rolls?draft.rolls[st.k].tot:10)+((FOLK[draft.folk]||{bonus:{}}).bonus[st.k]||0)});return s}
function draftHero(){return{...draft,folk:draft.folk||"manniska",klass:draft.klass||"riddare",s:rolled()}}
function renderCreator(){
 app.replaceChildren();
 const h=draftHero(),F=draft.folk?FOLK[draft.folk].n:"Folk?",K=draft.klass?KLASS[draft.klass].n:"Klass?";
 app.append(el("div",{class:"preview"},el("div",{class:"tv"},portrait(h)),
  el("div",{},el("h3",{},draft.namn||"Ny hjälte"),el("p",{},F+" · "+K),
   el("div",{class:"steps","aria-label":"Steg "+(step+1)+" av 5"},STEPS.map((_,i)=>el("i",{class:i<=step?"done":""}))))));
 [stepFolk,stepKlass,stepLook,stepDice,stepDone][step]();
}
function head(n,t,p){app.append(el("div",{class:"stephead"},el("small",{},"Steg "+(n)+" av 5"),el("h2",{},t),el("p",{},p)))}
function nav(canNext,nextTxt="Nästa"){
 app.append(el("div",{class:"nav"},
  el("button",{class:"btn ghost",onclick:()=>{if(step===0){home()}else{step--;renderCreator()}}},step===0?"Avbryt":"Tillbaka"),
  el("button",{class:"btn",disabled:!canNext,onclick:()=>{step++;renderCreator()}},nextTxt)));
}
function stepFolk(){
 head(1,"Vilket folk kommer du från?","Ditt folk ger dig en bonus och något speciellt du kan.");
 app.append(el("div",{class:"choices"},Object.entries(FOLK).map(([k,f])=>el("button",{class:"choice"+(draft.folk===k?" sel":""),"aria-pressed":draft.folk===k?"true":"false",onclick:()=>{draft.folk=k;if(k==="katt"&&draft.har<6)draft.har=7;renderCreator()}},
  el("strong",{},f.n),el("div",{class:"bonus"},f.b),el("span",{},f.t)))));
 nav(!!draft.folk);
}
function stepKlass(){
 head(2,"Vad är du bra på?","Din klass bestämmer hur du slåss och vilken specialförmåga du har.");
 app.append(el("div",{class:"choices"},Object.entries(KLASS).map(([k,c])=>el("button",{class:"choice"+(draft.klass===k?" sel":""),"aria-pressed":draft.klass===k?"true":"false",onclick:()=>{draft.klass=k;renderCreator()}},
  el("strong",{},c.n),el("div",{class:"bonus"},"Viktigast: "+STATS.find(s=>s.k===c.main).n),el("span",{},c.t),el("span",{},"Förmåga: "+c.fa)))));
 nav(!!draft.klass);
}
function swatchRow(label,arr,key){
 return el("div",{class:"field"},el("label",{},label),el("div",{class:"swatches"},arr.map((c,i)=>el("button",{class:"sw"+(draft[key]===i?" sel":""),style:"background:"+c,"aria-label":label+" "+(i+1),"aria-pressed":draft[key]===i?"true":"false",onclick:()=>{draft[key]=i;renderCreator()}}))));
}
function stepLook(){
 const cat=draft.folk==="katt";
 head(3,"Hur ser du ut?","Ge din hjälte ett namn och välj färger. Bilden högst upp ändras direkt.");
 const inp=el("input",{id:"namn",type:"text",maxlength:"16",placeholder:cat?"T.ex. Morris":"T.ex. Astrid Ekesköld",value:draft.namn,autocomplete:"off"});
 inp.addEventListener("input",()=>{draft.namn=inp.value;app.querySelector(".preview h3").textContent=draft.namn||"Ny hjälte";app.querySelector("#next").disabled=!draft.namn.trim()});
 app.append(el("div",{class:"field"},el("label",{for:"namn"},"Namn"),inp));
 if(!cat)app.append(swatchRow("Hudfärg",SKIN,"hud"));
 app.append(swatchRow(cat?"Pälsfärg":"Hårfärg",HAIR,"har"));
 if(!cat)app.append(el("div",{class:"field"},el("label",{},"Frisyr"),el("div",{class:"pills"},Object.entries(STYLES).map(([k,n])=>el("button",{class:"pill"+(draft.stil===k?" sel":""),onclick:()=>{draft.stil=k;renderCreator()}},n)))));
 app.append(swatchRow(cat?"Halsduk":"Kläder",OUTFIT,"klader"));
 app.append(el("div",{class:"nav"},
  el("button",{class:"btn ghost",onclick:()=>{step--;renderCreator()}},"Tillbaka"),
  el("button",{class:"btn",id:"next",disabled:!draft.namn.trim(),onclick:()=>{step++;renderCreator()}},"Nästa")));
}
function roll4(){const d=[1,2,3,4].map(()=>1+Math.floor(Math.random()*6));const low=d.indexOf(Math.min(...d));return{d,low,tot:d.reduce((a,b)=>a+b,0)-d[low]}}
function stepDice(){
 head(4,"Slå tärningarna!","För varje egenskap slår du fyra tärningar. Den lägsta räknas inte. Du får slå om tre gånger.");
 const F=FOLK[draft.folk];
 const list=el("div",{class:"stats"});
 STATS.forEach(st=>{
  const r=draft.rolls&&draft.rolls[st.k],b=F.bonus[st.k]||0,tot=r?r.tot+b:null;
  const main=KLASS[draft.klass].main===st.k;
  list.append(el("div",{class:"stat"},
   el("div",{class:"lbl"},el("b",{},st.n+(main?" ★":"")),el("span",{},st.d)),
   el("div",{class:"dice"},r?r.d.map((v,i)=>el("div",{class:"die spin"+(i===r.low?" drop":"")},v)):[0,1,2,3].map(()=>el("div",{class:"die",style:"opacity:.25"},"?"))),
   el("div",{class:"score"},tot??"–",b&&r?el("span",{class:"plus"},"+"+b+" folk"):null,r?el("small",{},fmt(mod(tot))):null)));
 });
 const bar=el("div",{class:"rollbar"});
 if(!draft.rolls){bar.append(el("button",{class:"btn",onclick:()=>{draft.rolls={};STATS.forEach(s=>draft.rolls[s.k]=roll4());renderCreator()}},"Slå alla tärningar"))}
 else{bar.append(el("button",{class:"btn ghost",disabled:draft.omslag<1,onclick:()=>{draft.omslag--;STATS.forEach(s=>draft.rolls[s.k]=roll4());renderCreator()}},"Slå om alla"),el("span",{},draft.omslag+" omslag kvar"))}
 app.append(bar,list,el("p",{class:"note"},"★ är viktigast för en "+KLASS[draft.klass].n.toLowerCase()+". Ett tal över 10 ger plus, under 10 ger minus."));
 nav(!!draft.rolls);
}
function stepDone(){
 const h=draftHero(),v=vitals(h),K=KLASS[h.klass];
 head(5,h.namn+" är redo!","Så här ser hjältebladet ut. Spara för att lägga till hjälten bland de andra.");
 app.append(el("div",{class:"vitals"},
  el("div",{class:"vital hp"},el("b",{},v.hp),el("span",{},"Liv")),
  el("div",{class:"vital ac"},el("b",{},v.ac),el("span",{},"Rustning")),
  el("div",{class:"vital atk"},el("b",{},fmt(v.atk)),el("span",{},"Anfall"))));
 app.append(el("div",{class:"ability"},el("strong",{},K.fa),el("p",{},K.ft)));
 const om=el("input",{id:"om",type:"text",maxlength:"60",placeholder:"T.ex. Rädd för spindlar men älskar pannkakor",value:draft.om,autocomplete:"off"});
 om.addEventListener("input",()=>draft.om=om.value);
 app.append(el("div",{class:"field"},el("label",{for:"om"},"En mening om hjälten (valfritt)"),om));
 app.append(el("div",{class:"nav"},
  el("button",{class:"btn ghost",onclick:()=>{step--;renderCreator()}},"Tillbaka"),
  el("button",{class:"btn",onclick:()=>{const hero={id:draft.id,namn:draft.namn.trim(),folk:draft.folk,klass:draft.klass,hud:draft.hud,har:draft.har,stil:draft.stil,klader:draft.klader,s:rolled(),om:draft.om.trim()};
   egna=[...egna,hero];save(KEY,egna);if(party.length<4){party=[...party,hero.id];save(PKEY,party)}home();flash(hero.namn+" är sparad!")}},"Spara hjälten")));
}

home();
</script>
