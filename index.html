<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tärningsriket</title>
<meta name="description" content="Ett svenskt rollspelsäventyr för hela familjen.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#142029">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tärningsriket">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: en kolumn som en äventyrsbok – startsida med hjältegalleri, skaparen som steg med levande förhandsvisning högst upp. Medvetet ett mörkt tema (natt i skogen). */
:root{
  --bg:#142029; --bg2:#1b2b37; --panel:#22384a; --line:#34506a;
  --fg:#f3eedf; --muted:#a9b8c2; --gold:#f2c14e; --gold-dk:#b9892a;
  --moss:#7cc47f; --red:#e35d4f; --sky:#6fb6e8;
  --display:"Pixelify Sans", "Courier New", monospace;
  --body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:16px;line-height:1.5;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 110px;
  background-image:radial-gradient(1px 1px at 20% 30%,#ffffff55 50%,transparent 51%),radial-gradient(1px 1px at 70% 12%,#ffffff44 50%,transparent 51%),radial-gradient(1.5px 1.5px at 85% 60%,#ffffff33 50%,transparent 51%),radial-gradient(1px 1px at 40% 80%,#ffffff33 50%,transparent 51%);
  background-size:260px 260px;}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.02em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{font-family:var(--display);font-weight:700;font-size:1.05rem;border:0;border-radius:6px;padding:12px 18px;background:var(--gold);color:#2a1d05;box-shadow:0 4px 0 var(--gold-dk);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-dk)}
.btn.ghost{background:var(--panel);color:var(--fg);box-shadow:0 4px 0 #0c151c}
.btn:disabled{opacity:.45;cursor:not-allowed}
canvas.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block;width:100%;height:auto}

/* Hero */
.hero{display:flex;align-items:center;gap:16px}
.hero svg{width:72px;height:72px;flex:none}
.hero h1{font-size:clamp(2rem,8vw,3rem);color:var(--gold);line-height:1}
.hero p{margin:6px 0 0;color:var(--muted);max-width:46ch}
.hero .titles{min-width:0;flex:1}
.hero h1{overflow-wrap:anywhere}
@media (max-width:440px){.hero{gap:10px}.hero svg{width:52px;height:52px}.hero h1{font-size:1.75rem}}
.gear{flex:none;align-self:flex-start;width:48px;height:48px;border-radius:8px;border:2px solid var(--line);background:var(--bg2);display:grid;place-items:center;padding:0}
.gear svg{width:26px;height:26px}
.sync{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:.82rem;color:var(--muted)}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.sync.ok i{background:var(--moss)} .sync.bad i{background:var(--red)} .sync.bad{color:#f3a99f}

/* Inställningar */
.setgroup{display:flex;flex-direction:column;gap:12px;background:var(--bg2);border:2px solid var(--line);border-radius:8px;padding:14px}
.setgroup h3{font-size:1.2rem;color:var(--gold)}
.setgroup p{margin:0;font-size:.92rem;color:var(--muted)}
.setgroup .field input{font-size:1rem;padding:10px}
.inrow{display:flex;gap:8px}
.inrow input{flex:1;min-width:0}
.inrow button{flex:none;border:2px solid var(--line);background:var(--panel);border-radius:6px;padding:0 12px;font-weight:800}
.btnrow{display:flex;flex-wrap:wrap;gap:10px}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:800}
.check input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--gold);flex:none}
.status{font-size:.9rem;padding:8px 10px;border-radius:6px;background:var(--panel)}
.status.ok{border-left:4px solid var(--moss)} .status.bad{border-left:4px solid var(--red)}
.warn{background:#3a2f14;border:2px solid var(--gold-dk);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:10px;font-size:.92rem}
.warn strong{color:var(--gold)}
ol.howto{margin:0;padding-left:20px;font-size:.92rem;display:flex;flex-direction:column;gap:4px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.section-head h2{font-size:1.4rem}
.section-head span{color:var(--muted);font-size:.9rem}

/* Hjältekort */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{background:var(--bg2);border:2px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;text-align:left;position:relative}
.card.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.card .tv{border-radius:4px;overflow:hidden;border:2px solid #0c151c}
.card .name{font-family:var(--display);font-size:1.2rem;line-height:1.1}
.card .meta{font-size:.82rem;color:var(--muted);line-height:1.3}
.card .row{display:flex;gap:6px}
.card .row button{flex:1;font-size:.82rem;font-weight:800;border-radius:5px;border:2px solid var(--line);background:var(--panel);padding:6px 4px}
.card.on .take{background:var(--gold);color:#2a1d05;border-color:var(--gold)}
.tag{position:absolute;top:14px;left:14px;font-family:var(--display);font-size:.7rem;background:#0c151cdd;padding:2px 6px;border-radius:3px;color:var(--moss)}
.newcard{border-style:dashed;align-items:center;justify-content:center;min-height:200px;color:var(--gold);font-family:var(--display);font-size:1.1rem;gap:6px}
.newcard b{font-size:2.6rem;line-height:1}

/* Sällskapsbar */
.party{position:fixed;left:0;right:0;bottom:0;z-index:5;background:#0e171eee;border-top:2px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.party .in{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.party .who{font-size:.9rem;color:var(--muted);min-width:0}
.party .who b{color:var(--fg);display:block;font-family:var(--display);font-size:1.05rem}
.note{background:var(--panel);border-left:4px solid var(--moss);padding:10px 12px;border-radius:4px;font-size:.92rem}

/* Skaparen */
.preview{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center;background:var(--bg2);border:2px solid var(--line);border-radius:8px;padding:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:3}
.preview .tv{border:2px solid #0c151c;border-radius:4px;overflow:hidden}
.preview h3{font-size:1.4rem}
.preview p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.steps{display:flex;gap:6px;margin-top:8px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps i.done{background:var(--gold)}
.stephead{display:flex;flex-direction:column;gap:4px}
.stephead small{font-family:var(--display);color:var(--gold);letter-spacing:.08em;text-transform:uppercase;font-size:.8rem}
.stephead h2{font-size:1.6rem}
.stephead p{margin:0;color:var(--muted)}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.choice{background:var(--bg2);border:2px solid var(--line);border-radius:8px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px}
.choice.sel{border-color:var(--gold);background:#2a3a2a}
.choice strong{font-family:var(--display);font-size:1.15rem}
.choice .bonus{color:var(--gold);font-weight:800;font-size:.85rem}
.choice span{font-size:.9rem;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-weight:800}
.field input{font:inherit;font-size:1.2rem;padding:12px;border-radius:6px;border:2px solid var(--line);background:var(--bg2);color:var(--fg);width:100%}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:42px;height:42px;border-radius:6px;border:3px solid var(--line)}
.sw.sel{border-color:var(--gold);transform:scale(1.08)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:2px solid var(--line);background:var(--bg2);border-radius:20px;padding:8px 14px;font-weight:800}
.pill.sel{border-color:var(--gold);background:var(--gold);color:#2a1d05}
.nav{display:flex;justify-content:space-between;gap:12px}

/* Tärningar & egenskaper */
.stats{display:flex;flex-direction:column;gap:8px}
.stat{display:grid;grid-template-columns:minmax(0,1fr) auto 52px;gap:10px;align-items:center;background:var(--bg2);border:2px solid var(--line);border-radius:8px;padding:8px 10px}
.stat .lbl b{display:block;font-family:var(--display);font-size:1.05rem}
.stat .lbl span{font-size:.8rem;color:var(--muted)}
.dice{display:flex;gap:4px}
.die{width:28px;height:28px;border-radius:5px;background:var(--fg);color:#142029;font-family:var(--display);font-weight:700;display:grid;place-items:center;font-size:.95rem}
.die.drop{opacity:.3;text-decoration:line-through}
.die.spin{animation:spin .45s ease-out}
@keyframes spin{0%{transform:rotate(-200deg) scale(.6)}100%{transform:none}}
.score{text-align:center;font-family:var(--display);font-size:1.5rem;line-height:1;font-variant-numeric:tabular-nums}
.score small{display:block;font-size:.75rem;color:var(--gold)}
.score .plus{color:var(--moss);font-size:.7rem;display:block}
.rollbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rollbar span{color:var(--muted);font-size:.9rem}

/* Hjälteblad */
.overlay{position:fixed;inset:0;background:#05090ccc;z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:env(safe-area-inset-top,0px) 0 0}
.sheet{background:var(--bg);border-top:3px solid var(--gold);border-radius:12px 12px 0 0;width:100%;max-width:720px;max-height:92%;overflow-y:auto;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.sheet-top{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:center}
.sheet-top .tv{border:2px solid #0c151c;border-radius:4px;overflow:hidden}
.sheet-top h2{font-size:1.8rem;color:var(--gold)}
.sheet-top p{margin:2px 0 0;color:var(--muted)}
.vitals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vital{background:var(--bg2);border:2px solid var(--line);border-radius:8px;padding:8px;text-align:center}
.vital b{display:block;font-family:var(--display);font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.vital span{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.vital.hp b{color:var(--red)} .vital.ac b{color:var(--sky)} .vital.atk b{color:var(--gold)}
.bars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;font-size:.88rem}
.bar .track{grid-column:1/-1;height:8px;background:var(--panel);border-radius:4px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--moss)}
.bar em{font-style:normal;font-weight:800;font-variant-numeric:tabular-nums}
.ability{background:var(--bg2);border:2px solid var(--line);border-radius:8px;padding:10px 12px}
.ability strong{font-family:var(--display);color:var(--gold)}
.ability p{margin:2px 0 0;font-size:.92rem}
.danger{color:var(--red)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#3a1f1c;border-radius:8px;padding:10px}
/* Äventyret */
.btn.small{font-size:.9rem;padding:8px 12px;box-shadow:0 3px 0 #0c151c}
.btn.big{font-size:1.25rem;padding:14px 22px;width:100%}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.purse{font-family:var(--display);color:var(--gold);font-size:.95rem;text-align:right;min-width:0}
.chapters{display:flex;flex-direction:column;gap:12px}
.chapter{background:var(--bg2);border:2px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px}
.chapter small{font-family:var(--display);color:var(--gold);letter-spacing:.06em;text-transform:uppercase;font-size:.8rem}
.chapter h3{font-size:1.4rem}
.chapter p{margin:0;color:var(--muted)}
.chapter.done{border-color:var(--moss)}
.chapter.locked{opacity:.55;border-style:dashed}
.tvbig{border:3px solid #0c151c;border-radius:6px;overflow:hidden;box-shadow:0 0 0 2px var(--line)}
.tv.mini{width:40px;flex:none;border-radius:3px;overflow:hidden;border:2px solid #0c151c}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chip{display:flex;gap:8px;align-items:center;background:var(--bg2);border:2px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
.chip.out{opacity:.5}
.chipinfo{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.chipinfo b{font-family:var(--display);font-size:1rem;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chipinfo span{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.hp{height:7px;background:#0c151c;border-radius:4px;overflow:hidden}
.hp i{display:block;height:100%;background:var(--red);transition:width .3s}
.story{display:flex;flex-direction:column;gap:12px;font-size:1.12rem;line-height:1.65;max-width:62ch}
.story p{margin:0}
.readrow{display:flex;justify-content:flex-end}
.actions{display:flex;flex-direction:column;gap:10px}
.choicebtn{text-align:left;background:var(--panel);border:2px solid var(--line);border-left:6px solid var(--gold);border-radius:8px;padding:14px 16px;font-weight:800;font-size:1.05rem;display:flex;flex-direction:column;gap:2px}
.choicebtn small{font-weight:700;color:var(--muted);font-size:.85rem}
.choicebtn.special{border-left-color:var(--sky)}
.choicebtn:disabled{opacity:.45;cursor:not-allowed}
.choicebtn:active:not(:disabled){transform:translateY(2px)}
.pack{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:.9rem;color:var(--muted);border-top:2px dashed var(--line);padding-top:12px}
.pack strong{font-family:var(--display);color:var(--fg)}
.pickers{display:flex;flex-direction:column;gap:8px}
.picker{display:flex;gap:12px;align-items:center;text-align:left;background:var(--bg2);border:2px solid var(--line);border-radius:8px;padding:8px 10px}
.picker .tv.mini{width:48px}
.picker b{display:block;font-family:var(--display);font-size:1.15rem}
.picker span{font-size:.88rem;color:var(--muted)}
.rollpanel{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;background:var(--bg2);border:2px solid var(--line);border-radius:10px;padding:16px}
.rollpanel h2{font-size:1.3rem}
.rollpanel p{margin:0}
.rollpanel .event{font-size:1.1rem}
.hint{color:var(--sky);font-size:.92rem;margin:0}
.dicebox{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.dicebox.many .d20{width:72px;height:72px}
.grows{display:flex;flex-direction:column;gap:4px;width:100%;max-width:320px}
.grow{display:grid;grid-template-columns:minmax(0,1fr) auto 24px;gap:8px;align-items:center;padding:4px 10px;border-radius:6px;background:var(--panel);font-variant-numeric:tabular-nums}
.grow b{text-align:left;font-weight:800}
.grow.ok i{color:var(--moss);font-style:normal;font-weight:800}
.grow.bad i{color:var(--red);font-style:normal;font-weight:800}
.d20{width:110px;height:110px}
.d20.spinning{transform:rotate(25deg) scale(.92)}
.d20.nat20{filter:drop-shadow(0 0 12px #f2c14e)}
.d20.nat1{filter:grayscale(.7)}
.rollres{display:flex;flex-direction:column;gap:6px;align-items:center}
.sum{font-family:var(--body);font-weight:800;font-size:1.35rem;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.sum small{display:block;font-size:.95rem;font-weight:700;color:var(--muted)}
.verdict{font-family:var(--body);font-weight:800;font-size:1.7rem}
.verdict.ok{color:var(--moss)} .verdict.bad{color:var(--red)}
.gains{display:flex;flex-wrap:wrap;gap:8px}
.gains span{background:#2a3a2a;border:2px solid var(--moss);border-radius:20px;padding:4px 12px;font-weight:800;font-size:.9rem}
.theend{display:flex;flex-direction:column;gap:2px;background:#2a3a2a;border:2px solid var(--moss);border-radius:8px;padding:12px 14px}
.theend strong{font-family:var(--display);font-size:1.3rem;color:var(--moss)}
.foes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.foe{background:#3a1f1c;border:2px solid #6a3a33;border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:4px}
.foe b{font-family:var(--display)}
.foe span{font-size:.75rem;color:var(--muted)}
.foe.out{opacity:.4}
.foehp i{background:var(--gold)}
.turn{font-size:1.5rem;color:var(--gold)}
.turn:empty{display:none}
@media (prefers-reduced-motion:reduce){.hp i{transition:none}}
@media (max-width:420px){.preview{grid-template-columns:84px 1fr}.sheet-top{grid-template-columns:96px minmax(0,1fr)}.stat{grid-template-columns:minmax(0,1fr) auto 46px}.die{width:24px;height:24px;font-size:.85rem}}
@media (prefers-reduced-motion:reduce){.die.spin{animation:none}.btn{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="party" id="party"></div>
<div id="modal"></div>

<script src="aventyr.js"></script>
<script>
/* ===== Regeldata ===== */
const STATS=[
 {k:"sty",n:"Styrka",d:"lyfta, slåss, knuffa"},
 {k:"smi",n:"Smidighet",d:"smyga, sikta, hoppa"},
 {k:"tal",n:"Tålighet",d:"orka, tåla smällar"},
 {k:"klo",n:"Klokhet",d:"minnas, lösa gåtor"},
 {k:"vis",n:"Visdom",d:"märka saker, känna av"},
 {k:"cha",n:"Charm",d:"prata, övertala, sjunga"}];
const FOLK={
 manniska:{n:"Människa",bonus:{sty:1,smi:1,tal:1,klo:1,vis:1,cha:1},b:"+1 på allt",t:"Bra på lite av allt."},
 alv:{n:"Alv",bonus:{smi:2},b:"+2 Smidighet",t:"Ser i mörker och har spetsiga öron som hör långt."},
 dvarg:{n:"Dvärg",bonus:{tal:2},b:"+2 Tålighet",t:"Seg som en sten. Hittar hemliga gångar i grottor."},
 halvling:{n:"Halvling",bonus:{smi:2},b:"+2 Smidighet",t:"Tur: får slå om när tärningen visar 1."},
 katt:{n:"Katt",bonus:{smi:2,vis:1},b:"+2 Smidighet, +1 Visdom",t:"Landar alltid på fötterna och hör en mus på långt håll."}};
const KLASS={
 riddare:{n:"Riddare",hd:10,main:"sty",ac:h=>16,acTxt:"Ringbrynja och sköld",vapen:"Svärd",skada:"1d8",fa:"Andra andningen",ft:"En gång per strid kan du hela dig själv med 1d10 kraft.",col:"#4b6fa8",t:"Stark och modig. Står längst fram och skyddar vännerna."},

function load(k,def){try{const v=JSON.parse(localStorage.getItem(k));return v??def}catch(e){return def}}

function cleanAndring(a){if(!a||typeof a!=="object")return null;const o={};EDITABLE.forEach(k=>{if(a[k]!==undefined)o[k]=a[k]});
 if(o.folk&&!FOLK[o.folk])return null;if(o.klass&&!KLASS[o.klass])return null;
 if(o.s&&!STATS.every(st=>typeof o.s[st.k]==="number"))delete o.s;return o}

const GKEY="tarningsriket-github";
let gh=Object.assign({repo:"tomas-m-andersson/dndjr",branch:"main",path:"hjaltar.json",token:"",auto:false},load(GKEY,{}));
let ghSha=null, syncTimer=null, deleted=new Set();
let sync={txt:"Sparas bara på den här enheten",cls:""};
const validHero=h=>h&&typeof h.id==="string"&&h.namn&&FOLK[h.folk]&&KLASS[h.klass]&&h.s&&STATS.every(st=>typeof h.s[st.k]==="number");
const nu=()=>new Date().toLocaleTimeString("sv-SE",{hour:"2-digit",minute:"2-digit"});
function setSync(txt,cls=""){sync={txt,cls};const s=document.getElementById("sync");if(s){s.className="sync "+cls;s.lastChild.textContent=txt}}
const ghBase=()=>"https://api.github.com/repos/"+gh.repo.trim();
const ghFileUrl=()=>ghBase()+"/contents/"+gh.path.trim().split("/").map(encodeURIComponent).join("/");
function ghHeaders(){const h={"Accept":"application/vnd.github+json"};if(gh.token)h.Authorization="Bearer "+gh.token.trim();return h}
function ghErr(st){return({401:"GitHub godkänner inte token. Kontrollera att hela token är inklistrad och att den inte har gått ut.",
 403:"Token får inte göra det här. Den behöver behörigheten Contents: Read and write för repot.",
 404:"Hittar inte repot. Kontrollera stavningen (ägare/repo) och att token har tillgång till det.",
 409:"Filen ändrades samtidigt från en annan enhet. Försök igen.",422:"GitHub tog inte emot filen. Försök igen."})[st]||("GitHub svarade med fel "+st+".")}
const b64e=s=>{const b=new TextEncoder().encode(s);let r="";for(let i=0;i<b.length;i+=0x8000)r+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(r)};
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,"")),c=>c.charCodeAt(0)));
async function ghGet(){
 const r=await fetch(ghFileUrl()+"?ref="+encodeURIComponent(gh.branch.trim()),{headers:ghHeaders(),cache:"no-store"});
 if(r.status===404)return null;
 if(!r.ok)throw new Error(ghErr(r.status));
 const j=await r.json();return{sha:j.sha,data:JSON.parse(b64d(j.content))};
}
function dataObj(){return{app:"Tärningsriket",version:1,uppdaterad:new Date().toISOString(),egna,sallskap:party,grundandringar:andringar,aventyr:spel}}
// Id:n som fanns i GitHub-filen senast vi synkade. Används för att skilja "ny här" från "borttagen på annan enhet".
const SKEY="tarningsriket-synkade";
let synkade=new Set(load(SKEY,[]));
function markSynced(){synkade=new Set(egna.map(h=>h.id));save(SKEY,[...synkade])}
function applyData(d,replace){
 if(Array.isArray(d.egna)){
  const remote=d.egna.filter(validHero),ids=new Set(remote.map(h=>h.id));
  const bara_har=replace?[]:egna.filter(h=>!ids.has(h.id)&&!synkade.has(h.id));
  egna=[...remote,...bara_har];
  synkade=ids;save(SKEY,[...ids]);
  if(bara_har.length)setTimeout(scheduleSync,0);
 }
 if(Array.isArray(d.sallskap))party=d.sallskap.filter(id=>typeof id==="string").slice(0,4);
 // Grundfigurernas ändringar: osparade ändringar på den här enheten vinner, annars gäller GitHub.
 if(replace||!andrDirty){andringar={};const g=d.grundandringar||{};BASE.forEach(b=>{const a=cleanAndring(g[b.id]);if(a)andringar[b.id]=a});andrDirty=false}
 else setTimeout(scheduleSync,0);
 // Äventyrets framsteg: det som sparades senast vinner.
 if(d.aventyr&&typeof d.aventyr==="object"&&(d.aventyr.tid||0)>(spel.tid||0)){spel=normSpel(d.aventyr);save(SPKEY,spel)}
 else if((spel.tid||0)>((d.aventyr&&d.aventyr.tid)||0))setTimeout(scheduleSync,0);
 save(KEY,egna);save(PKEY,party);save(AKEY,andringar);save(DKEY,andrDirty);
}
async function ghPut(){
 if(!gh.token.trim())throw new Error("Lägg in en GitHub-token i inställningarna först.");
 const cur=await ghGet();
 // Om filen ändrats från en annan enhet sedan vi läste den: behåll de hjältar som bara finns där.
 if(cur&&ghSha&&cur.sha!==ghSha&&Array.isArray(cur.data.egna)){
  const mine=new Set(egna.map(h=>h.id));
  cur.data.egna.forEach(h=>{if(validHero(h)&&!mine.has(h.id)&&!deleted.has(h.id))egna.push(h)});
  save(KEY,egna);
 }
 const body={message:"Tärningsriket: uppdatera hjältar",content:b64e(JSON.stringify(dataObj(),null,2)+"\n"),branch:gh.branch.trim()};
 if(cur)body.sha=cur.sha;
 const r=await fetch(ghFileUrl(),{method:"PUT",headers:{...ghHeaders(),"Content-Type":"application/json"},body:JSON.stringify(body)});
 if(!r.ok)throw new Error(ghErr(r.status));
 ghSha=(await r.json()).content.sha;markSynced();andrDirty=false;save(DKEY,false);
}
async function ghLoad(replace){
 if(!gh.repo.trim())return false;
 setSync("Hämtar från GitHub…");
 try{const r=await ghGet();
  if(!r){setSync("Ingen sparfil i GitHub än. Den skapas när du sparar första gången.");return false}
  ghSha=r.sha;applyData(r.data,replace);
  if(sync.txt==="Hämtar från GitHub…")setSync("Hämtat från GitHub "+nu(),"ok");
  if(view==="home")home();return true;
 }catch(e){setSync("Kunde inte hämta från GitHub. "+e.message,"bad");return false}
}
async function syncNow(){
 setSync("Sparar i GitHub…");
 try{await ghPut();setSync("Sparat i GitHub "+nu(),"ok");if(view==="home")home()}
 catch(e){setSync("Kunde inte spara. "+e.message,"bad")}
}
function scheduleSync(){
 if(!(gh.auto&&gh.token.trim())){setSync(gh.token.trim()?"Ändrat på den här enheten. Inte sparat i GitHub än.":"Sparas bara på den här enheten");return}
 clearTimeout(syncTimer);setSync("Sparar snart…");syncTimer=setTimeout(syncNow,1500);
}

function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
 const c=x=>Math.max(0,Math.min(255,Math.round(f<0?x*(1+f):x+(255-x)*f)));return"#"+[c(r),c(g),c(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function drawHero(cv,h,opt={}){
 const W=16,H=18;cv.width=W;cv.height=H;const g=cv.getContext("2d");
 const K=KLASS[h.klass]||{col:"#445566"};
 if(!opt.transparent){
  g.fillStyle=shade(K.col,-.55);g.fillRect(0,0,W,H);
  g.fillStyle=shade(K.col,-.4);g.fillRect(0,14,W,4); // golv
  g.fillStyle="#ffffff55";[[1,2],[13,1],[15,6],[0,9]].forEach(([x,y])=>g.fillRect(x,y,1,1)); // stjärnor
 }
 const p=(x,y,c)=>{if(c){g.fillStyle=c;g.fillRect(x,y,1,1)}};
 const skin=SKIN[h.hud],hair=HAIR[h.har],out=OUTFIT[h.klader];
 const ox=2,oy=4,cat=h.folk==="katt";
 if(cat){
  const fur=hair,map={F:fur,E:"#7fdc6a",N:"#e98aa8",P:"#e98aa8",W:shade(fur,.7),T:fur};
  if(h.flackar)map.W="#fbf7ee";
  CAT.forEach((r,y)=>[...r].forEach((ch,x)=>p(ox+x,oy+y,map[ch])));
  if(h.flackar){ // tigrerad med vita och ljusbruna fläckar (som Sally)
   const vit="#fbf7ee",brun="#d39a5a",rand=shade(fur,-.6),c=(pts,col)=>pts.forEach(([x,y])=>p(ox+x,oy+y,col));
   c([[3,4],[6,4],[4,3],[5,3],[1,5],[8,5],[3,8],[2,9],[4,9],[2,12],[4,12],[8,12],[11,8],[10,10]],rand); // ränder och mörk svans
   c([[7,6],[8,6],[1,3],[6,8],[7,8],[7,9],[8,9],[6,12],[7,12]],brun);                                   // ljusbruna fläckar
   c([[3,6],[6,6],[3,7],[4,7],[5,7],[6,7],[4,8],[5,8],[1,13],[2,13],[4,13],[5,13],[7,13],[8,13]],vit);  // nos, haka, bröst, tassar
  }else{
   // halsduk i klädfärg
   [2,3,4,5,6,7].forEach(x=>p(ox+x,oy+7,out)); p(ox+6,oy+8,out);
  }
 }else{
  const map={S:skin,E:"#1b1b22",M:shade(skin,-.35),O:out,D:shade(out,-.4),L:"#3a2c22"};
  HUMAN.forEach((r,y)=>[...r].forEach((ch,x)=>p(ox+x,oy+y,map[ch])));
  if(h.folk==="alv"){p(ox+1,oy+3,skin);p(ox+0,oy+2,skin);p(ox+10,oy+3,skin);p(ox+11,oy+2,skin)}
  const hr=(x,y)=>p(ox+x,oy+y,hair);
  if(h.stil!=="kal"){
   for(let x=3;x<=8;x++)hr(x,0);for(let x=2;x<=9;x++){hr(x,1);hr(x,2)}
   hr(2,3);hr(9,3);
   if(h.stil==="lang"){for(let y=3;y<=9;y++){hr(1,y);hr(10,y)}hr(2,4);hr(9,4)}
   if(h.stil==="tofs"){hr(0,2);hr(1,2);hr(0,3);hr(11,2);hr(10,2);hr(11,3);hr(0,4);hr(11,4)}
  }else{for(let x=3;x<=8;x++)p(ox+x,oy+2,skin)}
  if(h.folk==="dvarg"){ // skägg
   ["..HHHHHHHH..","..HHH..HHH..","..HHHHHHHH..","...HHHHHH...","....HHHH...."].forEach((r,i)=>[...r].forEach((ch,x)=>{if(ch==="H")hr(x,5+i)}));
   p(ox+5,oy+6,shade(skin,-.35));p(ox+6,oy+6,shade(skin,-.35));
  }
  if(h.folk==="halvling"){p(ox+2,oy+13,skin);p(ox+3,oy+13,skin);p(ox+8,oy+13,skin);p(ox+9,oy+13,skin)} // bara fötter
 }
 // klassprylar
 const k=h.klass;
 if(k==="trollkarl"){const c=shade(out,-.15);p(9,0,c);p(8,1,c);p(9,1,c);for(let x=7;x<=10;x++)p(x,2,c);for(let x=6;x<=10;x++)p(x,3,c);
   for(let x=cat?2:3;x<=(cat?11:12);x++)p(x,cat?5:4,c);p(8,3,"#f2c14e");
   for(let y=4;y<=17;y++)p(14,y,"#8a5a2b");p(14,3,"#6fe3ff");p(13,3,"#6fe3ff55");p(15,3,"#6fe3ff55");p(14,2,"#6fe3ff55")}
 if(k==="riddare"){if(!cat){const m="#b9c3cc",d="#7d8790";for(let x=4;x<=11;x++){p(x,4,m);p(x,5,m)}for(let x=5;x<=10;x++)p(x,3,m);p(4,6,d);p(11,6,d);p(4,7,d);p(11,7,d);p(7,2,"#e35d4f");p(8,2,"#e35d4f")}
   for(let y=6;y<=13;y++)p(14,y,"#dfe6ec");p(13,14,"#f2c14e");p(14,14,"#f2c14e");p(15,14,"#f2c14e");p(14,15,"#6b4423");p(14,16,"#6b4423");
   const s="#7d8790";for(let y=13;y<=16;y++)for(let x=0;x<=2;x++)p(x,y,s);p(1,14,"#f2c14e")}
 if(k==="bagskytt"){const b="#8a5a2b";[[13,7],[14,8],[15,9],[15,10],[15,11],[14,12],[13,13]].forEach(([x,y])=>p(x,y,b));for(let y=8;y<=12;y++)p(13,y,"#e8e3d8");
   if(!cat){p(1,9,"#6b4423");p(1,10,"#6b4423");p(1,11,"#6b4423");p(1,8,"#e35d4f")}}
 if(k==="smygare"){p(14,14,"#dfe6ec");p(14,13,"#dfe6ec");p(14,15,"#6b4423");p(13,15,"#f2c14e");p(15,15,"#f2c14e");
   if(!cat){const c=shade(out,-.25);for(let x=3;x<=12;x++)p(x,4,c);for(let x=2;x<=13;x++)p(x,5,c);p(4,6,c);p(11,6,c);p(4,7,c);p(11,7,c)}}
 if(k==="helare"){const yy=cat?oy+10:oy+10,xx=cat?ox+4:ox+5;p(xx,yy-1,"#f2c14e");p(xx-1,yy,"#f2c14e");p(xx,yy,"#f2c14e");p(xx+1,yy,"#f2c14e");p(xx,yy+1,"#f2c14e");
   for(let y=10;y<=15;y++)p(14,y,"#6b4423");p(13,9,"#b9c3cc");p(14,9,"#b9c3cc");p(15,9,"#b9c3cc");p(14,8,"#b9c3cc")}
 if(k==="bard"){const w="#a8693a";[[13,12],[14,12],[13,13],[14,13],[15,13],[13,14],[14,14]].forEach(([x,y])=>p(x,y,w));p(14,13,"#3a2c22");for(let y=8;y<=11;y++)p(15,y,"#6b4423");p(15,7,"#f2c14e")}
}

const d=n=>1+Math.floor(Math.random()*n);
function slaa(expr,dubbel){ // "1d6+2" → {tot,txt}
 const m=/^(\d+)d(\d+)([+-]\d+)?$/.exec(expr.replace(/\s/g,""));if(!m)return{tot:0,txt:expr};
 const n=(+m[1])*(dubbel?2:1),sid=+m[2],plus=+(m[3]||0),r=[];for(let i=0;i<n;i++)r.push(d(sid));
 const tot=Math.max(1,r.reduce((a,b)=>a+b,0)+plus);return{tot,txt:r.join("+")+(plus?(plus>0?"+":"")+plus:"")};
}

function rullaD20(box,klar,antal=1){
 if(rullar)return;rullar=true;
 const slut=Array.from({length:antal},()=>d(20)),reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
 let t=0;const tick=()=>{box.innerHTML=slut.map(()=>dieSvg(d(20),"spinning")).join("");t++;
  if(t<(reduce?1:12))setTimeout(tick,60);else{box.innerHTML=slut.map(v=>dieSvg(v,v===20?"nat20":v===1?"nat1":"")).join("");rullar=false;klar(slut)}};

// Vilken hjälte i sällskapet uppfyller ett krav på klass eller folk (vaken)?
function kravHjalte(krav){if(!krav||!(krav.klass||krav.folk))return null;
 return vaken().find(h=>(!krav.klass||h.klass===krav.klass)&&(!krav.folk||h.folk===krav.folk))||null}
// Är valet synligt? Krav på flagga, klass, folk och "en gång" döljer valet helt.
function valSynligt(v,K){
 if(v.krav&&v.krav.flagga&&!K.flaggor.includes(v.krav.flagga))return false;
 if(v.krav&&v.krav.inteFlagga&&K.flaggor.includes(v.krav.inteFlagga))return false;
 if(v.krav&&(v.krav.klass||v.krav.folk)&&!kravHjalte(v.krav))return false;
 if(v.engang&&K.flaggor.includes(v.engang))return false;
 return true;
}
// En scens text kan vara en lista med stycken där vissa bara visas om en flagga finns (om) eller saknas (inteOm).
function scenText(sc,K){
 if(!Array.isArray(sc.text))return sc.text;
 const har=f=>K.flaggor.includes(f);
 return sc.text.filter(p=>typeof p==="string"||((!p.om||[].concat(p.om).every(har))&&(!p.inteOm||![].concat(p.inteOm).some(har))))
  .map(p=>typeof p==="string"?p:p.text).join("\n\n");
}

  slot.replaceChildren(warnBox("Varning: filen i GitHub skrivs över",
   gh.path+" i repot "+gh.repo+" ersätts med hjältarna på den här enheten ("+egna.length+" egna hjältar). Hjältar som bara finns i GitHub behålls bara om filen har ändrats sedan den hämtades hit. Är du säker?",
   "Ja, spara till GitHub",async()=>{slot.replaceChildren();show("Sparar…");await syncNow();show(sync.txt,sync.cls==="ok"?true:false)},
   ()=>slot.replaceChildren()))}},"Spara till GitHub nu");
 const btnForget=el("button",{class:"btn ghost danger",onclick:()=>{
  slot.replaceChildren(warnBox("Glömma token?","Token tas bort från den här enheten. Hjältarna finns kvar. Du kan klistra in token igen när du vill.",
   "Ja, glöm token",()=>{gh.token="";gh.auto=false;tok.value="";auto.checked=false;save(GKEY,gh);slot.replaceChildren();setSync("Sparas bara på den här enheten");show("Token är borttagen.",null)},
   ()=>slot.replaceChildren()))}},"Glöm token");

 let installPart;
 if(isStandalone())installPart=el("p",{},"Tärningsriket körs redan som app på den här enheten.");
 else if(installEvt)installPart=el("button",{class:"btn",onclick:async()=>{installEvt.prompt();const r=await installEvt.userChoice;installEvt=null;if(r.outcome==="accepted")close()}},"Installera Tärningsriket");
 else installPart=el("ol",{class:"howto"},
  el("li",{},"iPhone/iPad (Safari): tryck på Dela-knappen (fyrkant med pil uppåt) längst ner, välj Lägg till på hemskärmen och tryck Lägg till."),
  el("li",{},"Android (Chrome): tryck på ⋮ uppe till höger och välj Installera app eller Lägg till på startskärmen."),
  el("li",{},"Dator (Chrome/Edge): klicka på installera-ikonen längst till höger i adressfältet."));

 const sh=el("div",{class:"sheet",role:"dialog","aria-modal":"true","aria-label":"Inställningar"},
  el("div",{class:"section-head"},el("h2",{},"Inställningar"),el("button",{class:"btn ghost",onclick:close},"Stäng")),
  el("section",{class:"setgroup"},el("h3",{},"Installera som app"),installPart),
  upplasGroup(),
  el("section",{class:"setgroup"},el("h3",{},"Spara hjältarna i GitHub"),
   el("p",{},"Egna hjältar och sällskapet sparas i en JSON-fil i ditt GitHub-repo. Då finns de på alla enheter. Token sparas bara i den här webbläsaren och skickas bara till GitHub."),
   el("div",{class:"field"},el("label",{for:"gh-token"},"GitHub-token"),el("div",{class:"inrow"},tok,eye)),
   el("div",{class:"field"},el("label",{for:"gh-repo"},"Repo (ägare/namn)"),repo),
   el("div",{class:"inrow"},el("div",{class:"field",style:"flex:1;min-width:0"},el("label",{for:"gh-branch"},"Gren"),branch),el("div",{class:"field",style:"flex:2;min-width:0"},el("label",{for:"gh-path"},"Filnamn"),path)),
   el("label",{class:"check",for:"gh-auto"},auto,el("span",{},"Spara automatiskt till GitHub när något ändras")),
   el("div",{class:"btnrow"},btnSave,btnTest),
   slot,status,
   el("div",{class:"btnrow"},btnPush,btnLoad),
   el("div",{class:"btnrow"},btnForget)));
 const ov=el("div",{class:"overlay",onclick:e=>{if(e.target===ov)close()}},sh);
 m.replaceChildren(ov);
}

home();
ghLoad();
</script>
