<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Liggande läge – mockup</title>
<style>
:root{
  --bg:#142029; --bg2:#1b2b37; --panel:#22384a; --line:#34506a;
  --fg:#f3eedf; --muted:#a9b8c2; --gold:#f2c14e; --gold-dk:#b9892a;
  --moss:#7cc47f; --red:#e35d4f; --sky:#6fb6e8;
  --body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--body);
  overscroll-behavior:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}

/* ---------- Vrid-mobilen-skärmen ---------- */
#vrid{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px;z-index:50;background:var(--bg)}
#vrid.pa{display:grid}
#vrid .ikon{font-size:0;width:92px;height:92px;margin:0 auto 18px;border:5px solid var(--gold);border-radius:14px;
  animation:vrida 2.2s ease-in-out infinite}
@keyframes vrida{0%,35%{transform:rotate(0) scaleX(.62)}65%,100%{transform:rotate(90deg) scaleX(.62)}}
#vrid h1{font-size:22px;margin:0 0 8px}
#vrid p{color:var(--muted);margin:0;max-width:30ch}

/* ---------- Liggande scen ---------- */
#scen{position:fixed;inset:0;display:flex;gap:0;
  padding:max(6px,env(safe-area-inset-top))max(6px,env(safe-area-inset-right))max(6px,env(safe-area-inset-bottom))max(6px,env(safe-area-inset-left))}
#tvdel{position:relative;flex:1 1 auto;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px}
#tvram{position:relative;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:#000;
  box-shadow:0 10px 30px #0007}
#tv{display:block;image-rendering:pixelated;width:100%;height:100%}

/* ---------- HUD ovanpå TV:n ---------- */
.hud{position:absolute;display:flex;gap:5px;pointer-events:none}
#hjaltar{display:flex;gap:6px;width:100%;justify-content:center;align-items:stretch}
#hjaltar .kort{flex:1 1 0;max-width:190px;display:flex;align-items:center;gap:7px;background:#17242fcc;
  border:1.5px solid var(--line);border-radius:9px;padding:5px 8px}
#hjaltar .kort .txt{min-width:0;flex:1 1 auto}
#hjaltar .kort b{font-size:12px}
#hjaltar .kort .matare{width:100%;height:7px}
#hjaltar .kort small{font-size:10px}
#ryggsack{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  background:#17242fcc;border:1.5px solid var(--line);border-radius:9px;padding:4px 11px;position:relative}
#ryggsack canvas{image-rendering:pixelated;width:28px;height:28px}
#ryggsack span{font-size:9px;color:var(--muted);font-weight:700;letter-spacing:.02em}
#ryggsack b{position:absolute;top:-5px;right:-5px;background:var(--gold);color:#2a1d05;font-size:10px;
  min-width:17px;height:17px;border-radius:999px;display:grid;place-items:center;border:2px solid var(--bg)}
#ryggsack:active{background:#22384a}
#fiender{inset:0;display:block}
.kort{pointer-events:auto;background:#0d1620cc;border:1.5px solid #ffffff22;border-radius:7px;
  padding:3px 6px;min-width:0;backdrop-filter:blur(3px);line-height:1.15}
.kort b{display:block;font-size:11px;white-space:nowrap;letter-spacing:.01em}
.kort .matare{height:5px;border-radius:3px;background:#00000066;overflow:hidden;margin-top:2px;width:62px}
.kort .matare i{display:block;height:100%;background:var(--red);transition:width .35s ease}
.kort small{display:block;font-size:9px;color:var(--muted);margin-top:1px}
.kort.tur{border-color:var(--gold);box-shadow:0 0 0 2px #f2c14e55,0 0 14px #f2c14e44}
.kort.ute{opacity:.45}
.kort.gift{border-color:var(--moss)}
.kort.gift .matare i{background:var(--moss)}
/* fiendens livmätare: en kort, liggande stapel ovanför monstrets huvud */
.fmat{position:absolute;height:6px;border-radius:4px;background:#0b131bcc;
  box-shadow:0 0 0 1px #0008, 0 1px 3px #0006;overflow:hidden;transform:translateX(-50%)}
.fmat i{display:block;height:100%;background:var(--moss);border-radius:4px;transition:width .35s ease}
.fmat.skadad i{background:#e3c44f}
.fmat.kritisk i{background:var(--red)}

/* knapparna dyker bara upp när de behövs */
#handling{position:absolute;left:6px;right:6px;bottom:7px;display:flex;gap:7px;justify-content:center;
  flex-wrap:wrap;pointer-events:none}
#handling button{pointer-events:auto;background:#243e55;
  border:2px solid var(--line);border-radius:9px;padding:7px 13px;font-weight:800;font-size:13px;
  box-shadow:0 4px 0 #0f1b24,0 6px 14px #0006;transition:transform .08s,box-shadow .08s}
#handling button:active{transform:translateY(3px);box-shadow:0 1px 0 #0f1b24}
#handling button.gyllene{background:linear-gradient(#f2c14e,#d79f2b);border-color:#8d6a1b;color:#2a1d05}
#handling button[disabled]{opacity:.4}

/* tärningen */
#tarning{position:absolute;inset:0;display:none;place-items:center;background:#0b131bbb;pointer-events:auto}
#tarning.pa{display:grid}
#tarning .kub{width:96px;height:96px;border-radius:16px;background:linear-gradient(#f7f2e3,#cdc3aa);color:#20303d;
  display:grid;place-items:center;font-size:44px;font-weight:900;box-shadow:0 10px 24px #000a}
#tarning .kub.rullar{animation:skaka .28s linear infinite}
@keyframes skaka{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-4px,-6px) rotate(-7deg)}
 50%{transform:translate(5px,3px) rotate(6deg)}75%{transform:translate(-3px,5px) rotate(-4deg)}100%{transform:translate(0,0) rotate(0)}}
#tarning .vad{margin-top:12px;font-weight:800;text-align:center;text-shadow:0 2px 6px #000}

/* ---------- Textpanelen ---------- */
#text{flex:0 0 clamp(230px,32%,400px);display:flex;flex-direction:column;min-height:0;overflow:hidden;padding-left:8px}
#rubrik{display:flex;align-items:center;gap:8px;margin-bottom:5px}
#rubrik h2{font-size:14px;margin:0;color:var(--gold);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.liten{background:#1d2e3c;border:1.5px solid var(--line);border-radius:7px;padding:4px 8px;font-size:12px;font-weight:700}
#berattelse{flex:1 1 auto;overflow:auto;font-size:14px;line-height:1.45;padding-right:4px;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#berattelse p{margin:0 0 9px}
#berattelse p:first-child::first-letter{font-size:24px;font-weight:900;color:var(--gold);line-height:1}
#val{flex:0 1 auto;display:flex;flex-direction:column;gap:5px;margin-top:6px;overflow:auto;max-height:60%;overscroll-behavior:contain;padding-bottom:2px;
  -webkit-mask-image:linear-gradient(#000 calc(100% - 14px),transparent);mask-image:linear-gradient(#000 calc(100% - 14px),transparent)}
#val:only-child,#val.allt{-webkit-mask-image:none;mask-image:none}
#panelknappar{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
#panelknappar:empty{display:none}
#panelknappar button{flex:1 1 44%;background:#243e55;border:2px solid var(--line);border-radius:9px;
  padding:9px 6px;font-weight:800;font-size:13px;text-align:center;box-shadow:0 4px 0 #0f1b24}
#panelknappar button.gyllene{background:linear-gradient(#f2c14e,#d79f2b);border-color:#8d6a1b;color:#2a1d05}
#panelknappar button:active{transform:translateY(3px);box-shadow:0 1px 0 #0f1b24}
#val button{display:block;width:100%;text-align:left;background:#1d2e3c;border:2px solid var(--line);
  border-left:5px solid var(--gold);border-radius:8px;padding:7px 10px;font-size:13px;font-weight:700}
#val button small{display:block;font-weight:600;font-size:11px;color:var(--muted);margin-top:1px}
#val button:active{background:#274054}

/* lägesväljaren – bara för mockupen */
/* dev-märkningen från bilder.js döljs här, den stjäl plats i liggande läge */
body>div[style*="DEV"],body>div:not([id]):not(.hud){display:none}
#kapitel{cursor:pointer}
</style>
</head>
<body>

<div id="vrid">
  <div>
    <div class="ikon"></div>
    <h1>Vrid mobilen</h1>
    <p>Lägg mobilen på sidan, så får hela äventyret plats på en skärm.</p>
  </div>
</div>

<div id="scen" hidden>
  <div id="tvdel">
    <div id="tvram">
      <canvas id="tv"></canvas>
      <div class="hud" id="fiender"></div>
      <div id="handling"></div>
      <div id="tarning"><div><div class="kub" id="kub">?</div><div class="vad" id="tvad"></div></div></div>
    </div>
    <div id="hjaltar"></div>
  </div>
  <div id="text">
    <div id="rubrik">
      <h2 id="kapitel">Vintern som inte tar slut</h2>
      <button class="liten" id="helskarm">Helskärm</button>
      <button class="liten" id="pausa">Pausa</button>
    </div>
    <div id="berattelse"></div>
    <div id="panelknappar"></div>
    <div id="val"></div>
  </div>
</div>

<script src="figurval.js"></script>
<script src="bilder.js"></script>
<script>
/* MOCKUP av liggande helskärmsläge. Fristående sida: rör inte spelet.
   Ritar TV:n med samma bilder och samma rutnät som spelet (96×54, egna bilder i 320×180). */
const TVW=96,TVH=54,BTW=320,BTH=180,CU=64*TVW/BTW;

const PARTY=[
 {id:"ville", klass:"krigare",  vapen:"svard",     namn:"Ville", liv:38,max:45},
 {id:"tomas", klass:"helare",   vapen:"klubba",    namn:"Tomas", liv:52,max:52},
 {id:"linda", klass:"bagskytt", vapen:"pilbage",   namn:"Linda", liv:31,max:39,gift:true},
 {id:"sally", klass:"katt",     vapen:"klor",      namn:"Sally", liv:23,max:33,folk:"katt"}
];

const LAGEN={
 berattelse:{
  bild:"hall", figur:null, fiender:null,
  text:["Hallen är stor som ett stall. En trappa svänger upp till andra våningen, och i taket hänger en kristallkrona som är helt täckt av istappar.",
        "Pianot hörs från ett rum till vänster. Det slutar inte spela, men ingen har hälsat på er.",
        "Det är kallare inne än ute.",
        "Spegeln kan hänga var som helst i det här huset. Ni måste leta."],
  val:[["Gå mot pianot, in i balsalen"],["Gå in i köket"],["Gå in i biblioteket"],["Gå ut i glashuset"],["Gå upp i tornet"]],
  knappar:[]
 },
 prov:{
  bild:"kok", figur:null, fiender:null,
  text:["Köket är enormt, med en spis så lång som en vägg och kopparkastruller i rader. Allt är täckt av frost.",
        "På ett bord mitt i rummet står en middag uppdukad för tolv personer.",
        "Uppe i skorstenen hörs ett prassel."],
  val:[["Leta i skafferiet","Slå för Visdom"],["Tända spisen","Slå för Fingerfärdighet"],["Gå ut igen"]],
  knappar:[]
 },
 strid:{
  bild:"kok",
  fiender:[{bild:"vampyrfladdermus",namn:"Vampyrfladdermus 1",liv:9,max:13},
           {bild:"vampyrfladdermus",namn:"Vampyrfladdermus 2",liv:13,max:13},
           {bild:"vampyrfladdermus",namn:"Vampyrfladdermus 3",liv:4,max:13,gift:true}],
  text:["<b>Runda 2 – Lindas tur.</b>",
        "Vampyrfladdermössen släpper taget om skorstenen och dyker ner mot er.",
        "Ville högg med Flammsvärdet och träffade för 7 i skada.",
        "Vampyrfladdermus 1 bet Sally för 3 i skada."],
  val:[],
  knappar:[["Attack","gyllene"],["Skjut pil",""],["Läkedryck",""],["Fly",""]]
 }
};
// Fler strider att bläddra bland, så man ser hur olika monster och bossar tar sig ut
const STRIDSKNAPPAR=[["Attack","gyllene"],["Skjut pil",""],["Läkedryck",""],["Fly",""]];
function strid(bild,rubrik,rader,fiender){
 return {bild,fiender,val:[],knappar:STRIDSKNAPPAR,text:["<b>"+rubrik+"</b>",...rader]};
}
Object.assign(LAGEN,{
 strid2:strid("gruva_inne","Runda 1 – Villes tur.",
  ["Tre gestalter reser sig ur gruset längre in i gången.",
   "Vätten fräser och vinkar fram skeletten."],
  [{bild:"vatte",namn:"Vätte",liv:4,max:10},
   {bild:"skelett",namn:"Skelett 1",liv:9,max:12},
   {bild:"skelett",namn:"Skelett 2",liv:12,max:12}]),
 strid3:strid("skog","Runda 3 – Sallys tur.",
  ["Vargarna sprider ut sig mellan träden.",
   "Linda sköt en pil och träffade för 6 i skada."],
  [{bild:"varg",namn:"Varg 1",liv:7,max:16},{bild:"varg",namn:"Varg 2",liv:15,max:16}]),
 strid4:strid("gruva_inne","Runda 2 – Tomas tur.",
  ["Spindlarna släpper sig ner från taket.",
   "Trollet morrar och höjer klubban."],
  [{bild:"spindel",namn:"Jättespindel",liv:5,max:14},
   {bild:"troll",namn:"Bergstroll",liv:22,max:30}]),
 boss1:strid("spegelsal","Bossen – Grevinnan Dimma.",
  ["Dimman drar ihop sig framför spegeln och blir till en gestalt.",
   "Ville högg med Flammsvärdet och träffade för 9 i skada."],
  [{bild:"dimfrun",namn:"Grevinnan Dimma",liv:58,max:90,boss:true}]),
 boss2:strid("run|oknen|2|0|boss","Bossen – Sandkungen.",
  ["Sanden rinner undan och något reser sig ur golvet.",
   "Sandkungen lyfter sin spira."],
  [{bild:"sandkungen",namn:"Sandkungen",liv:71,max:110,boss:true}]),
 boss3:strid("gruva_inne","Bossen kallar på hjälp!",
  ["Skuggan sjunker ihop och ett skelett kliver fram ur väggen.",
   "Skuggan är nere på en fjärdedel av sitt liv."],
  [{bild:"skuggan",namn:"Skuggan",liv:14,max:60,boss:true},
   {bild:"skelett",namn:"Skelett",liv:12,max:12}]),
 boss4:strid("skog","Bossen – Eldklo.",
  ["Den unga draken slår ut med vingarna över gläntan.",
   "Sally fräste och klöste för 4 i skada."],
  [{bild:"eldklo",namn:"Eldklo",liv:46,max:120,boss:true}]),
});

let lage="berattelse", knappPaTV=false, FIENDEPOS=[];

/* ---------- rita TV:n ---------- */
function ritaTV(){
 const L=LAGEN[lage], cv=document.getElementById("tv");
 cv._rita=()=>{ritaTV();hud()};   // ritas om när en bildfil har laddats klart, då flyttas mätarna med
 const HI=window.egnaBilderAntal&&egnaBilderAntal()>0;
 const BG=window.bakgrundBild?bakgrundBild(L.bild):null;
 if(HI){cv.width=BTW;cv.height=BTH}else{cv.width=TVW;cv.height=TVH}
 const g=cv.getContext("2d");g.imageSmoothingEnabled=false;
 g.fillStyle="#0b131b";g.fillRect(0,0,cv.width,cv.height);
 if(BG&&window.ritaBakgrund)ritaBakgrund(g,BG,cv.width,cv.height);
 if(HI)g.setTransform(BTW/TVW,0,0,BTH/TVH,0,0);
 let lyft=0;
 if(BG&&window.bakgrundLyft){const ly=bakgrundLyft(L.bild);if(ly){lyft=ly*TVH/180;g.translate(0,-lyft)}}
 const kant=window.bakgrundKant?bakgrundKant(L.bild):0;

 // hjältarna, längst till vänster
 PARTY.forEach((h,i)=>{const bi=window.egenHjalte&&egenHjalte(h,"sta");
  if(bi)ritaRuta(g,bi,i*14+7+kant,TVH,h.folk==="katt"?CU*.75:CU,{alpha:h.liv>0?1:.35})});

 // fienderna, från höger kant och inåt
 const right=[];
 if(L.fiender)L.fiender.forEach((f,i)=>right.push({k:f.bild,key:"f:"+i,boss:!!f.boss}));
 else if(L.figur)[].concat(L.figur).forEach(k=>right.push({k}));
 right.forEach(f=>{f.mb=window.egenMonster&&egenMonster(f.k,f.boss,"sta");
  f.mm=f.mb?(((window.FIGURVAL||{})[f.k]||{}).storlek||(f.boss?4:2)):0;
  f.hh=f.mb?CU*f.mm/2:0; f.w=f.mb?CU*f.mm/2*.75:14});
 const plats=TVW-2-(PARTY.length*14+2), bredd=right.reduce((a,f)=>a+f.w,0);
 const krymp=right.length>1?Math.max(0,(bredd-plats)/(right.length-1)):0;
 const FLYG=window.FLYGER||{},FH=window.FLYGHOJD||[8,15,4];
 const MARK=right.filter(f=>!FLYG[f.k]&&f.hh).reduce((a,f)=>Math.max(a,f.hh),0);
 let x=TVW-2-kant, forst=true, flygNr=0;
 right.forEach(f=>{
  if(!forst)x+=krymp; forst=false; x-=f.w;
  if(!f.mb)return;
  const bas=MARK?MARK+1:0, rum=Math.max(0,TVH-1-(f.hh||0)-bas);
  const fly=FLYG[f.k]?bas+Math.round(FH[flygNr++%FH.length]/17*Math.min(rum,17)):0;
  ritaRuta(g,f.mb,x+f.w/2,TVH-fly,CU*f.mm/2);
  f.mitt=x+f.w/2; f.bot=TVH-fly-lyft});   // sparas så att livmätaren kan läggas precis under monstret
 FIENDEPOS=right;
 if(window.ritaOm)ritaOm();
}

/* Var i rutan monstret faktiskt börjar, så att mätaren hamnar precis ovanför huvudet
   och inte högt upp i den tomma delen av bildrutan. */
const TOPP={};
function toppRad(c,k){
 if(TOPP[k]!=null)return TOPP[k];
 try{const d=c.getContext("2d").getImageData(0,0,c.width,c.height).data;
  for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++)
   if(d[(y*c.width+x)*4+3]>20)return TOPP[k]=y/c.height;
  return 0}catch(_){return 0}   // tom ruta = bilden är inte laddad än, spara inte svaret
}

/* ---------- HUD ---------- */
function hud(){
 const L=LAGEN[lage];
 const hj=document.getElementById("hjaltar");
 hj.replaceChildren(...PARTY.map((h,i)=>{
  const k=document.createElement("div");
  k.className="kort"+(h.liv<=0?" ute":"")+(h.gift?" gift":"")+(lage==="strid"&&i===2?" tur":"");
  const t=document.createElement("div");t.className="txt";
  t.innerHTML='<b>'+h.namn+'</b><div class="matare"><i style="width:'+(h.liv/h.max*100)+'%"></i></div>'+
   '<small>'+(h.liv>0?h.liv+"/"+h.max+(h.gift?" · förgiftad":""):"Svimmad")+'</small>';
  k.append(t);return k}));
 hj.append(ryggsacksknapp());
 // fienderna: ingen ruta och ingen text, bara en smal mätare precis under monstret
 const fi=document.getElementById("fiender"),ram=document.getElementById("tvram");
 const skala=ram.clientWidth/TVW;
 fi.replaceChildren(...((L.fiender||[]).map((f,i)=>{
  const pos=FIENDEPOS[i];if(!pos)return null;
  const del=f.liv/f.max, b=document.createElement("div");
  b.className="fmat";
  const bredd=Math.max(18,Math.round(pos.w*skala*.45));          // knappt halva monstrets bredd
  const mitt=Math.min(Math.max(pos.mitt*skala,bredd/2+2),ram.clientWidth-bredd/2-2);
  b.style.left=Math.round(mitt)+"px";
  b.style.width=bredd+"px";
  const huvud=pos.bot-pos.hh*(1-toppRad(pos.mb,pos.k));                // där monstret faktiskt börjar
  b.style.top=Math.max(2,Math.round(huvud*skala-9))+"px";              // strax ovanför huvudet
  b.innerHTML='<i style="width:'+(del*100)+'%"></i>';
  return b}).filter(Boolean)));
 const knappar=(L.knappar||[]).map(([t,kl])=>{
  const b=document.createElement("button");b.textContent=t;if(kl)b.className=kl;
  b.onclick=()=>{if(t==="Attack"||t==="Skjut pil")rullaTarning("Attack mot Vampyrfladdermus 3")};
  return b});
 const hn=document.getElementById("handling");
 hn.replaceChildren(...(knappPaTV?knappar:[]));
 document.getElementById("panelknappar").replaceChildren(...(knappPaTV?[]:knappar));
}

/* liten pixelryggsäck, samma som i spelet */
const RYGGSACK={rows:["....LLLL....","...L....L...","..BBBBBBBB..",".BBbbbbbbBB.",".BbBBBBBBbB.",".BbBGGGGBbB.",".BbBGYYGBbB.",".BbBBBBBBbB.",".BbbbbbbbbB.",".BBBBBBBBBB.","..BBBBBBBB.."],
 pal:{L:"#6b4a2e",B:"#8a5a2b",b:"#6b4423",G:"#5a3a1e",Y:"#f2c14e"}};
function ryggsacksknapp(){
 const b=document.createElement("button");b.id="ryggsack";b.setAttribute("aria-label","Öppna ryggsäcken");
 const c=document.createElement("canvas"),R=RYGGSACK;
 c.width=R.rows[0].length;c.height=R.rows.length;
 const g=c.getContext("2d");
 R.rows.forEach((rad,y)=>[...rad].forEach((t,x)=>{if(R.pal[t]){g.fillStyle=R.pal[t];g.fillRect(x,y,1,1)}}));
 const txt=document.createElement("span");txt.textContent="Ryggsäck";
 const antal=document.createElement("b");antal.textContent="3";
 b.append(c,txt,antal);
 b.onclick=()=>alert("Här skulle ryggsäcken öppnas: läkedrycker, guld och föremål.");
 return b;
}

/* ---------- text och val ---------- */
function panel(){
 const L=LAGEN[lage];
 document.getElementById("berattelse").innerHTML=L.text.map(t=>"<p>"+t+"</p>").join("");
 document.getElementById("berattelse").scrollTop=0;
 const v=document.getElementById("val");
 v.replaceChildren(...L.val.map(([t,under])=>{
  const b=document.createElement("button");
  b.innerHTML=t+(under?'<small>'+under+'</small>':"");
  b.onclick=()=>{if(under)rullaTarning(under);};
  return b}));
}

/* ---------- tärningen: syns bara när den används ---------- */
function rullaTarning(vad){
 const ruta=document.getElementById("tarning"),kub=document.getElementById("kub");
 document.getElementById("tvad").textContent=vad;
 ruta.classList.add("pa");kub.classList.add("rullar");
 let n=0;const t=setInterval(()=>{kub.textContent=1+Math.floor(Math.random()*20);if(++n>14){clearInterval(t);
  kub.classList.remove("rullar");const slag=1+Math.floor(Math.random()*20);kub.textContent=slag;
  document.getElementById("tvad").textContent=vad+" · "+(slag>=10?"Lyckas!":"Misslyckas");
  setTimeout(()=>ruta.classList.remove("pa"),1200)}},60);
}

/* ---------- storlek: TV:n fyller höjden, texten tar resten ---------- */
function passaIn(){
 const liggande=window.innerWidth>window.innerHeight;
 document.getElementById("vrid").classList.toggle("pa",!liggande);
 document.getElementById("scen").hidden=!liggande;
 if(!liggande)return;
 const del=document.getElementById("tvdel"),ram=document.getElementById("tvram");
 const W=del.clientWidth,H=del.clientHeight,mal=BTW/BTH,hudH=58;   // plats kvar under TV:n till hjältarna
 let w=W,h=w/mal; if(h>H-hudH){h=H-hudH;w=h*mal}
 ram.style.width=Math.floor(w)+"px";ram.style.height=Math.floor(h)+"px";
}

function visa(){passaIn();ritaTV();hud();panel()}

/* Helskärm + håll skärmen vaken så länge spelet är i helskärm.
   Wake Lock släpps av webbläsaren så fort fliken göms, därför tas den om när man kommer tillbaka. */
let vaken=null;
async function hallVaken(){
 if(!("wakeLock" in navigator)||vaken)return;
 try{vaken=await navigator.wakeLock.request("screen");
  vaken.addEventListener("release",()=>{vaken=null;knappText()})}catch(_){vaken=null}
 knappText();
}
function slappVaken(){if(!vaken)return;const v=vaken;vaken=null;v.release().catch(()=>{});knappText()}
function knappText(){
 const b=document.getElementById("helskarm");
 b.textContent=document.fullscreenElement?"Avsluta":"Helskärm";
 b.title=document.fullscreenElement
  ?(vaken?"Helskärm på. Skärmen hålls vaken.":"Helskärm på. Den här webbläsaren kan inte hålla skärmen vaken.")
  :"Helskärm och skärmen hålls vaken";
}
document.getElementById("helskarm").onclick=async()=>{
 const d=document.documentElement;
 if(document.fullscreenElement){await document.exitFullscreen().catch(()=>{})}
 else{if(d.requestFullscreen)await d.requestFullscreen().catch(()=>{});
  if(screen.orientation&&screen.orientation.lock)screen.orientation.lock("landscape").catch(()=>{})}
};
document.addEventListener("fullscreenchange",()=>{
 if(document.fullscreenElement)hallVaken();else slappVaken();
 knappText();setTimeout(visa,120)});
document.addEventListener("visibilitychange",()=>{
 if(document.visibilityState==="visible"&&document.fullscreenElement)hallVaken()});
knappText();
document.getElementById("pausa").onclick=()=>alert("Här skulle paus-menyn ligga.");

addEventListener("resize",visa);
addEventListener("orientationchange",()=>setTimeout(visa,250));
if(window.forladda)forladda(visa,6000); else visa();
visa();
